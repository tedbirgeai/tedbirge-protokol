name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Nightly re-scan so drift is caught even without a commit.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Database security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Re-checks the six findings closed on 2026-07-30: no migration may hand
      # write privileges on the service-role-only tables back to anon/authenticated.
      - name: Verify RLS + grant invariants
        run: bun run security:check

      - name: Lint
        run: bun run lint

  tests:
    name: E2EE isolation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Proves relays cannot read message bodies and tampered packets are rejected.
      - name: Mesh E2EE isolation suite
        run: bun run test

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit
        run: bun audit --audit-level=high
